# The open engine's own check, on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The export carries no lockfile, so this is npm install, not npm ci.
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
