# Publish a release: push a tag vX.Y.Z whose version equals package.json and server.json.
#
# npm and the MCP registry both authenticate with this workflow's OIDC token, so there is no
# publishing secret anywhere in the repository. npm adds provenance on its own for a public package
# published this way. See RELEASING.md for the one-time setup and the first publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # A named environment, so the npm trusted publisher can be tied to it and reviewers can be
    # required before a tag publishes.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install -g npm@11.5.1
      - name: The tag, the package and the registry entry name one version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srvpkg=$(node -p "require('./server.json').packages[0].version")
          echo "tag $tag, package.json $pkg, server.json $srv, server.json package $srvpkg"
          test "$tag" = "$pkg" && test "$tag" = "$srv" && test "$tag" = "$srvpkg"
      # The export carries no lockfile, so this is npm install, not npm ci.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          CI: 'true'
      - name: Publish to npm
        run: npm publish --access public
      - name: Install the MCP registry publisher, pinned and checked
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
