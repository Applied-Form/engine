<!doctype html>
<html lang="en" data-register="ii">

<title>Plans and pricing</title>
<style>
  /* A hand-written stand-in for the pipeline's page for brief b09 (test/builders.test.mjs), in the
     study system's values. It passes every rule under that system. */
  body { margin: 0; background: #FFFFFF; color: #161D19; font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif; font-size: 19px; line-height: 1.5; }
  main { max-width: 36rem; margin: 0 auto; padding: 48px 24px; }

  p { margin: 0 0 16px; }
  table { border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 16px 8px 0; }
  th, [data-voice="data"] { font-family: "IBM Plex Mono", SFMono-Regular, Menlo, monospace; font-weight: 400; }

<body>
<main>
  <h1>Plans and pricing</h1>
  <p>Three plans. Each includes the command-line tool and the hosted dashboard.</p>
  <table>
    <tr><th scope="col">Plan</th><th scope="col">Per month</th><th scope="col">Builds</th></tr>
    <tr><td>Starter</td><td data-voice="data">$0</td><td data-voice="data">1,000</td></tr>
    <tr><td>Team</td><td data-voice="data">$29</td><td data-voice="data">10,000</td></tr>
    <tr><td>Scale</td><td data-voice="data">$99</td><td data-voice="data">50,000</td></tr>

  <p>Builds past a plan's limit cost one cent each, billed monthly. <a href="#faq">Read the questions people ask</a>.</p>
