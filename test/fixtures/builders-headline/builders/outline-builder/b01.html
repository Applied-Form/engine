<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our approach to measurement</title>
<style>
  /* A hand-written stand-in for a builder's answer to brief b01 (test/builders.test.mjs). The first heading
     is an h2 and the page has no h1, which no builder is asked for and no WCAG criterion requires. Nothing
     else is planted for the universal rules. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #0F172A; background: #FFFFFF; line-height: 1.6; }
  main { max-width: 40rem; margin: 0 auto; padding: 48px 24px; }
  h2 { font-size: 32px; line-height: 1.2; margin: 0 0 16px; }
  h3 { font-size: 22px; margin: 28px 0 8px; }
  p { font-size: 18px; margin: 0 0 16px; }
</style>
</head>
<body>
<main>
  <h2>Our approach to measurement</h2>
  <p>We measure a thing only when we can say how we measured it.</p>
  <h3>What we check</h3>
  <p>Every instrument is calibrated twice a year against a reference we keep in the open.</p>
</main>
</body>
</html>
